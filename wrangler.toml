name = "napoleon"
main = "worker.js"
compatibility_date = "2025-01-01"

[[d1_databases]]
binding = "DB"
database_name = "napoleon-db"
database_id = "97c86f88-a3bc-4adb-b3c5-f1e986db26b4"

[assets]
directory = "."
binding = "ASSETS"
run_worker_first = ["/api/*"]

# ▼ 追加：毎時0分に自己対戦を実行するCronトリガー
[triggers]
crons = ["0 * * * *"]
