name: Self-Play Training (Every 3 Hours)

on:
  schedule:
    # 3時間おきに実行 (UTC基準: 0時, 3時, 6時, 9時, 12時, 15時, 18時, 21時)
    # 無料枠(月2000分)に収まりやすく、かつ学習頻度を上げる設定
    - cron: '0 */3 * * *'
  workflow_dispatch: # 手動で実行できるようにする（テスト用）

jobs:
  train:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Run self-play batch
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
        # 1回あたり100マッチ（約3分）を実行して学習させる
        run: node run-selfplay.mjs 100
